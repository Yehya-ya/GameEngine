plugins {
    id 'java-library'
}

group = 'org.example'
version = '1.0'

def lwjglModules = [libs.lwjgl.core, libs.lwjgl.glfw, libs.lwjgl.opengl, libs.lwjgl.stb]

dependencies {
    api platform(libs.lwjgl.bom)
    lwjglModules.each { lwjglModule ->
        api lwjglModule
        runtimeOnly variantOf(lwjglModule) { classifier(lwjglNatives) }
    }

    api libs.imgui.binding
    api libs.imgui.lwjgl3
    runtimeOnly "io.github.spair:imgui-java-natives-$nativePlatform:${libs.versions.imgui.get()}"

    api libs.joml
    api libs.artemis
    compileOnlyApi libs.jetbrains.annotations

    implementation libs.snakeyaml
    implementation libs.log4j.slf4j
    implementation libs.slf4j.api
}
