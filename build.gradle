plugins {
    id 'com.diffplug.spotless' version '8.9.0'
}

repositories {
    mavenCentral()
}

spotless {
    java {
        target '*/src/**/*.java'
        palantirJavaFormat('2.103.0')
    }
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}
