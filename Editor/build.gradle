plugins {
    id 'java'
    id 'application'
}

dependencies {
    implementation project(':GameEngine')
    implementation libs.lwjgl.tinyfd
    runtimeOnly variantOf(libs.lwjgl.tinyfd) { classifier(rootProject.lwjglNatives) }
    implementation libs.imgui.binding
    implementation libs.imgui.lwjgl3
    runtimeOnly "io.github.spair:imgui-java-natives-${rootProject.nativePlatform}:${libs.versions.imgui.get()}"
}

application {
    mainClass = 'Editor.Main'
}

def releaseBuildOption = '-Dgameengine.build=release'
def licenseFiles = [rootProject.file('LICENSE'), rootProject.file('THIRD-PARTY-NOTICES.txt')]

distributions {
    main {
        contents {
            from(licenseFiles)
        }
    }
}

tasks.named('startScripts', CreateStartScripts) {
    defaultJvmOpts = [releaseBuildOption]
}

def isWindows = rootProject.nativePlatform == 'windows'
def runtimeModules = [
    'java.base',
    'java.compiler',
    'java.desktop',
    'java.management',
    'java.naming',
    'java.rmi',
    'java.scripting',
    'java.sql',
    'jdk.unsupported',
]
def jpackageExecutable = javaToolchains.launcherFor(java.toolchain).map { launcher ->
    launcher.metadata.installationPath.file('bin/jpackage').asFile.path
}

tasks.register('jpackage', Exec) {
    def libraryDirectory = new File(tasks.named('installDist', Sync).get().destinationDir, 'lib')
    def packageDirectory = layout.buildDirectory.dir('package').get().asFile

    group = 'distribution'
    description = 'Packages the editor as an app folder with its own Java runtime, in build/package.'
    dependsOn 'installDist'
    inputs.dir(libraryDirectory)
    inputs.files(licenseFiles)
    outputs.dir(packageDirectory)

    executable = jpackageExecutable.get()
    args '--type', 'app-image',
            '--name', project.name,
            '--app-version', project.version,
            '--input', libraryDirectory,
            '--main-jar', tasks.named('jar', Jar).get().archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--add-modules', runtimeModules.join(','),
            '--java-options', releaseBuildOption,
            '--app-content', licenseFiles.join(','),
            '--dest', packageDirectory
    if (isWindows) {
        args '--win-console'
    }

    doFirst {
        packageDirectory.deleteDir()
    }
}
