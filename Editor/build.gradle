plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0'

dependencies {
    implementation project(':GameEngine')
    implementation libs.lwjgl.tinyfd
    runtimeOnly variantOf(libs.lwjgl.tinyfd) { classifier(lwjglNatives) }
}

application {
    mainClass = 'Main'
}

tasks.named('run') {
    args = [rootProject.file('SampleProject').path]
}
